<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("clawpilotTheme");
      const theme =
        param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <title>AI Application Engineer Course</title>
  <style>
    :root {
      color-scheme: light;
      --cp-bg: #f7f4ef;
      --cp-bg-elevated: #fcfbf8;
      --cp-surface: #ffffff;
      --cp-surface-soft: #f5f5f5;
      --cp-border: #dedede;
      --cp-border-strong: #919191;
      --cp-text: #242424;
      --cp-text-muted: #5c5c5c;
      --cp-text-soft: #6f6f6f;
      --cp-accent: #b11f4b;
      --cp-accent-hover: #9a1a41;
      --cp-accent-soft: rgba(177, 31, 75, 0.08);
      --cp-accent-fg: #ffffff;
      --cp-success: #16a34a;
      --cp-danger: #dc2626;
      --cp-warning: #f59e0b;
      --cp-link: #0078d4;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
      --cp-overlay: rgba(255, 255, 255, 0.8);
      --cp-panel: rgba(255, 255, 255, 0.86);
      --cp-panel-strong: rgba(255, 255, 255, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.55);
      --cp-highlight: rgba(177, 31, 75, 0.12);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --cp-bg: #3d3b3a;
      --cp-bg-elevated: #343231;
      --cp-surface: #292929;
      --cp-surface-soft: #2e2e2e;
      --cp-border: #474747;
      --cp-border-strong: #5f5f5f;
      --cp-text: #dedede;
      --cp-text-muted: #919191;
      --cp-text-soft: #b0b0b0;
      --cp-accent: #fd8ea1;
      --cp-accent-hover: #fb7b91;
      --cp-accent-soft: rgba(253, 142, 161, 0.14);
      --cp-accent-fg: #1a1a1a;
      --cp-success: #4ade80;
      --cp-danger: #f87171;
      --cp-warning: #fbbf24;
      --cp-link: #4da6ff;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      --cp-overlay: rgba(41, 41, 41, 0.88);
      --cp-panel: rgba(41, 41, 41, 0.72);
      --cp-panel-strong: rgba(41, 41, 41, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.04);
      --cp-highlight: rgba(253, 142, 161, 0.12);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--cp-bg);
      color: var(--cp-text);
      font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.55;
    }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    a { color: var(--cp-link); }
    code, pre { font-family: Consolas, "Courier New", Courier, monospace; }
    .app { min-height: 100vh; display: grid; grid-template-columns: 280px 1fr; }
    .sidebar {
      position: sticky; top: 0; height: 100vh; overflow-y: auto;
      border-right: 1px solid var(--cp-border); background: var(--cp-bg-elevated);
      padding: 24px 16px;
    }
    .brand { padding: 0 8px 20px; border-bottom: 1px solid var(--cp-border); }
    .brand-mark {
      width: 42px; height: 42px; display: grid; place-items: center;
      border-radius: 10px; background: var(--cp-surface); color: var(--cp-accent);
      border: 1px solid var(--cp-border-strong); font-family: Consolas, "Courier New", Courier, monospace;
      font-weight: 800; letter-spacing: -1px;
    }
    .brand h1 { font-size: 18px; line-height: 1.25; margin: 12px 0 4px; }
    .eyebrow {
      margin: 0; color: var(--cp-accent); text-transform: uppercase;
      font-size: 12px; font-weight: 700; letter-spacing: .08em;
    }
    .muted { color: var(--cp-text-muted); }
    .small { font-size: 13px; }
    .search {
      width: 100%; margin: 16px 0 10px; padding: 10px 12px; border: 1px solid var(--cp-border);
      border-radius: 10px; background: var(--cp-surface); color: var(--cp-text); outline: none;
    }
    .search:focus { border-color: var(--cp-accent); }
    .module-list { display: grid; gap: 6px; margin-top: 8px; }
    .module-button {
      width: 100%; display: grid; grid-template-columns: 30px 1fr auto; gap: 8px; align-items: center;
      text-align: left; border: 1px solid transparent; border-radius: 10px; padding: 10px;
      background: transparent; color: var(--cp-text);
    }
    .module-button:hover { background: var(--cp-surface-soft); }
    .module-button.active { background: var(--cp-accent-soft); border-color: var(--cp-accent); }
    .module-number {
      width: 28px; height: 28px; border-radius: 10px; display: grid; place-items: center;
      border: 1px solid var(--cp-border); color: var(--cp-text-muted); font-size: 12px; font-weight: 700;
    }
    .module-button.active .module-number { background: var(--cp-accent); color: var(--cp-accent-fg); border-color: var(--cp-accent); }
    .module-name { font-size: 13px; font-weight: 650; }
    .state-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--cp-border-strong); }
    .state-dot.done { background: var(--cp-success); }
    .sidebar-actions { margin-top: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .main { min-width: 0; }
    .topbar {
      min-height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 14px 32px; border-bottom: 1px solid var(--cp-border); background: var(--cp-bg-elevated);
      position: sticky; top: 0; z-index: 10;
    }
    .topbar-actions { display: flex; align-items: center; gap: 14px; }
    .progress-wrap { min-width: 220px; }
    .progress-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--cp-text-muted); margin-bottom: 5px; }
    .progress-track { height: 8px; border-radius: 10px; background: var(--cp-surface-soft); overflow: hidden; border: 1px solid var(--cp-border); }
    .progress-fill { height: 100%; background: var(--cp-accent); transition: width .25s ease; }
    .content { max-width: 1240px; margin: 0 auto; padding: 32px 40px 64px; }
    .hero {
      display: grid; grid-template-columns: 1.5fr .7fr; gap: 24px; align-items: stretch;
      margin-bottom: 24px;
    }
    .card {
      background: var(--cp-surface); border: 1px solid var(--cp-border); border-radius: 16px;
      padding: 24px; box-shadow: 0 0 2px var(--cp-border), 0 1px 2px var(--cp-border);
    }
    .hero h2 { font-size: clamp(28px, 3.5vw, 42px); line-height: 1.12; letter-spacing: -.025em; margin: 8px 0 14px; }
    .hero p { max-width: 720px; }
    .metric-card { display: grid; align-content: center; gap: 16px; }
    .metric { border-bottom: 1px solid var(--cp-border); padding-bottom: 12px; }
    .metric:last-child { border-bottom: 0; padding-bottom: 0; }
    .metric strong { display: block; font-size: 25px; line-height: 1; margin-bottom: 5px; }
    .module-workspace {
      display: grid; grid-template-columns: minmax(0, 1fr) 148px;
      grid-template-areas: "content navigation"; gap: 20px; align-items: start;
    }
    .tabs {
      grid-area: navigation; position: sticky; top: 92px; z-index: 8;
      display: grid; gap: 8px; padding: 10px; margin: 0;
      border: 1px solid var(--cp-border); border-radius: 16px;
      background: var(--cp-bg-elevated);
      box-shadow: 0 0 2px var(--cp-border), 0 1px 2px var(--cp-border);
    }
    #tabContent { grid-area: content; min-width: 0; }
    .tab, .btn {
      border: 1px solid var(--cp-border); border-radius: 10px; padding: 9px 14px;
      background: var(--cp-surface); color: var(--cp-text); font-weight: 650;
    }
    .tab { width: 100%; text-align: left; }
    .tab:hover, .btn:hover { border-color: var(--cp-accent); }
    .tab.active, .btn.primary { background: var(--cp-accent); color: var(--cp-accent-fg); border-color: var(--cp-accent); }
    .btn.danger { color: var(--cp-danger); }
    .btn:disabled { cursor: not-allowed; opacity: .55; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    h3 { margin: 0 0 12px; font-size: 20px; }
    h4 { margin: 18px 0 8px; }
    ul, ol { padding-left: 22px; }
    li + li { margin-top: 7px; }
    .concept {
      border-left: 3px solid var(--cp-accent); padding: 12px 14px;
      background: var(--cp-accent-soft); border-radius: 0 10px 10px 0; margin: 14px 0;
    }
    .lesson-layout { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 24px; align-items: start; }
    .lesson-main { display: grid; gap: 20px; min-width: 0; }
    .lesson-aside { position: sticky; top: 96px; display: grid; gap: 16px; }
    .lesson-section { scroll-margin-top: 100px; }
    .lesson-section h3 { font-size: 24px; letter-spacing: -.015em; }
    .lesson-section > p { font-size: 16px; max-width: 78ch; }
    .lesson-lead { font-size: 18px !important; color: var(--cp-text-soft); }
    .concept-deep {
      padding: 20px 0; border-bottom: 1px solid var(--cp-border);
    }
    .concept-deep:last-child { border-bottom: 0; padding-bottom: 0; }
    .concept-deep h4 { margin: 0 0 8px; font-size: 18px; }
    .concept-deep p { margin: 8px 0; }
    .lesson-index a {
      display: block; padding: 8px 10px; margin: 2px 0; border-left: 2px solid var(--cp-border);
      color: var(--cp-text-muted); text-decoration: none; font-size: 13px;
    }
    .lesson-index a:hover { color: var(--cp-accent); border-left-color: var(--cp-accent); background: var(--cp-accent-soft); }
    .snapshot {
      padding: 18px; border: 1px solid var(--cp-border); border-radius: 10px;
      background: var(--cp-bg-elevated); overflow-x: auto;
    }
    .snapshot-header {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding-bottom: 12px; margin-bottom: 14px; border-bottom: 1px solid var(--cp-border);
    }
    .snapshot-lights { display: flex; gap: 5px; }
    .snapshot-lights i { width: 8px; height: 8px; border-radius: 50%; background: var(--cp-border-strong); }
    .flow-grid { display: grid; grid-template-columns: repeat(3, minmax(150px, 1fr)); gap: 10px; min-width: 520px; }
    .flow-step { position: relative; padding: 14px; border: 1px solid var(--cp-border); border-radius: 10px; background: var(--cp-surface); }
    .flow-step strong { display: block; color: var(--cp-accent); margin-bottom: 4px; font-family: Consolas, "Courier New", Courier, monospace; font-size: 12px; }
    .trace {
      display: grid; grid-template-columns: 74px 1fr; gap: 8px 14px; font-family: Consolas, "Courier New", Courier, monospace;
      font-size: 12px; padding: 14px; border: 1px solid var(--cp-border); border-radius: 10px; background: var(--cp-surface-soft);
    }
    .trace dt { color: var(--cp-text-muted); }
    .trace dd { margin: 0; overflow-wrap: anywhere; }
    .decision-table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    .decision-table th, .decision-table td { padding: 10px; text-align: left; border: 1px solid var(--cp-border); vertical-align: top; }
    .decision-table th { background: var(--cp-surface-soft); font-size: 12px; text-transform: uppercase; color: var(--cp-text-muted); }
    .step-list { list-style: none; padding: 0; counter-reset: worked-step; }
    .step-list li { position: relative; padding: 0 0 18px 42px; counter-increment: worked-step; }
    .step-list li::before {
      content: counter(worked-step); position: absolute; left: 0; top: 0; width: 28px; height: 28px;
      display: grid; place-items: center; border: 1px solid var(--cp-accent); border-radius: 10px;
      color: var(--cp-accent); font-weight: 700; font-size: 12px;
    }
    .mistake-list { display: grid; gap: 10px; }
    .mistake { padding: 12px; border-left: 3px solid var(--cp-warning); background: var(--cp-surface-soft); }
    .theme-btn { min-width: 94px; }
    .architecture {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 16px;
      border: 1px dashed var(--cp-border-strong); border-radius: 10px; background: var(--cp-surface-soft);
    }
    .architecture span { border: 1px solid var(--cp-border); background: var(--cp-surface); padding: 7px 10px; border-radius: 10px; font-size: 13px; }
    .architecture b { color: var(--cp-accent); }
    .callout { padding: 14px; border-radius: 10px; border: 1px solid var(--cp-border); background: var(--cp-surface-soft); }
    .lab-step { display: grid; grid-template-columns: auto 1fr; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--cp-border); }
    .lab-step:last-child { border-bottom: 0; }
    .workbench-banner {
      display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: center;
      padding: 20px; border: 1px solid var(--cp-accent); border-radius: 16px; background: var(--cp-accent-soft);
      margin-bottom: 20px;
    }
    .workbench-banner h3 { margin: 4px 0; }
    .practice-stack { display: grid; gap: 20px; }
    .phase {
      display: grid; grid-template-columns: 44px 1fr; gap: 14px; padding: 18px 0;
      border-bottom: 1px solid var(--cp-border);
    }
    .phase:last-child { border-bottom: 0; }
    .phase-number {
      width: 36px; height: 36px; display: grid; place-items: center; border: 1px solid var(--cp-accent);
      color: var(--cp-accent); border-radius: 10px; font-weight: 800; font-family: Consolas, "Courier New", Courier, monospace;
    }
    .phase h4 { margin: 0 0 6px; }
    .phase p { margin: 6px 0; }
    .command-block { position: relative; margin: 10px 0; }
    .command-block pre { padding-right: 90px; margin: 0; }
    .copy-btn { position: absolute; right: 8px; top: 8px; padding: 5px 9px; font-size: 12px; }
    .file-tree {
      margin: 12px 0; padding: 14px; border: 1px solid var(--cp-border); border-radius: 10px;
      background: var(--cp-bg-elevated); font-family: Consolas, "Courier New", Courier, monospace;
      white-space: pre-wrap; font-size: 13px;
    }
    .acceptance-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .acceptance {
      padding: 12px; border: 1px solid var(--cp-border); border-radius: 10px; background: var(--cp-surface-soft);
    }
    .acceptance strong { display: block; color: var(--cp-accent); font-family: Consolas, "Courier New", Courier, monospace; font-size: 12px; }
    .experiment { padding: 14px; border-left: 3px solid var(--cp-warning); background: var(--cp-surface-soft); margin: 10px 0; }
    .lead-card { padding: 14px; border: 1px solid var(--cp-border); border-radius: 10px; }
    .lead-card strong { display: block; margin-bottom: 4px; }
    .resource-list { display: grid; gap: 8px; margin-top: 12px; }
    .resource-list a {
      display: block; padding: 10px; border: 1px solid var(--cp-border); border-radius: 10px;
      text-decoration: none; background: var(--cp-surface-soft);
    }
    .resource-list a:hover { border-color: var(--cp-accent); }
    .interview-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .interview-card { padding: 18px; border: 1px solid var(--cp-border); border-radius: 16px; background: var(--cp-surface); }
    .interview-card h4 { margin-top: 0; }
    .interview-card input {
      width: 100%; margin-top: 6px; border: 1px solid var(--cp-border); background: var(--cp-surface-soft);
      color: var(--cp-text); border-radius: 10px; padding: 9px;
    }
    .proof-list { display: grid; gap: 8px; }
    .proof-item { display: grid; grid-template-columns: 24px 1fr; gap: 8px; }
    .proof-item span:first-child { color: var(--cp-success); font-weight: 800; }
    input[type="checkbox"], input[type="radio"] { accent-color: var(--cp-accent); width: 17px; height: 17px; margin-top: 3px; }
    textarea {
      width: 100%; min-height: 150px; resize: vertical; border: 1px solid var(--cp-border);
      border-radius: 10px; padding: 12px; background: var(--cp-surface-soft); color: var(--cp-text); outline: none;
      font-family: Consolas, "Courier New", Courier, monospace; font-size: 13px;
    }
    textarea:focus { border-color: var(--cp-accent); }
    pre {
      white-space: pre-wrap; overflow-wrap: anywhere; background: var(--cp-bg-elevated);
      border: 1px solid var(--cp-border); border-radius: 10px; padding: 14px; font-size: 13px;
    }
    .question { padding: 18px 0; border-bottom: 1px solid var(--cp-border); }
    .question:last-child { border-bottom: 0; }
    .option {
      display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start;
      padding: 8px 10px; border-radius: 10px; margin: 4px 0;
    }
    .option:hover { background: var(--cp-surface-soft); }
    .result {
      margin-top: 16px; padding: 16px; border: 1px solid var(--cp-border);
      border-left: 4px solid var(--cp-warning); border-radius: 10px; background: var(--cp-surface-soft);
    }
    .result.pass { border-left-color: var(--cp-success); }
    .benchmark-row {
      display: grid; grid-template-columns: 1.5fr .8fr .8fr; gap: 12px; align-items: center;
      padding: 12px 0; border-bottom: 1px solid var(--cp-border);
    }
    .benchmark-row input {
      width: 100%; border: 1px solid var(--cp-border); background: var(--cp-surface-soft);
      color: var(--cp-text); border-radius: 10px; padding: 8px;
    }
    .evidence-form { display: grid; gap: 12px; margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--cp-border); }
    .evidence-form label { display: grid; gap: 5px; font-size: 13px; font-weight: 650; }
    .evidence-form input, .evidence-form textarea, .evidence-form select {
      width: 100%; border: 1px solid var(--cp-border); background: var(--cp-surface-soft);
      color: var(--cp-text); border-radius: 10px; padding: 9px;
    }
    .gate-fail { color: var(--cp-danger); }
    .gate-pass { color: var(--cp-success); }
    .badge {
      display: inline-flex; align-items: center; border: 1px solid var(--cp-border); border-radius: 10px;
      padding: 3px 8px; font-size: 12px; font-weight: 700; color: var(--cp-text-muted);
    }
    .badge.pass { color: var(--cp-success); border-color: var(--cp-success); }
    .mastery {
      margin-top: 20px; display: flex; justify-content: space-between; align-items: center; gap: 16px;
      padding: 18px; border: 1px solid var(--cp-border); border-radius: 16px; background: var(--cp-bg-elevated);
    }
    .dashboard-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
    .dashboard-stat { padding: 18px; border: 1px solid var(--cp-border); border-radius: 16px; background: var(--cp-surface); }
    .dashboard-stat strong { display: block; font-size: 26px; }
    .module-table { width: 100%; border-collapse: collapse; }
    .module-table th, .module-table td { text-align: left; padding: 11px; border-bottom: 1px solid var(--cp-border); }
    .module-table th { color: var(--cp-text-muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
    .hidden { display: none !important; }
    .mobile-menu { display: none; }
    .empty { text-align: center; padding: 28px; color: var(--cp-text-muted); }
    .footer-note { margin-top: 20px; color: var(--cp-text-muted); font-size: 12px; }
    @media (max-width: 1100px) {
      .module-workspace {
        grid-template-columns: minmax(0, 1fr);
        grid-template-areas: "navigation" "content";
        gap: 16px;
      }
      .tabs {
        top: 72px; display: flex; overflow-x: auto;
        border-radius: 10px; padding: 8px;
      }
      .tab { width: auto; flex: 0 0 auto; text-align: center; }
    }
    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { display: none; position: fixed; z-index: 30; width: min(88vw, 340px); box-shadow: var(--cp-shadow); }
      .sidebar.open { display: block; }
      .mobile-menu { display: inline-flex; }
      .hero, .grid-2, .lesson-layout { grid-template-columns: 1fr; }
      .lesson-aside { position: static; grid-row: 1; }
      .interview-grid { grid-template-columns: 1fr; }
      .dashboard-grid { grid-template-columns: 1fr 1fr; }
      .topbar { padding: 12px 18px; }
      .content { padding: 22px 16px; }
    }
    @media (max-width: 560px) {
      .dashboard-grid { grid-template-columns: 1fr; }
      .progress-wrap { min-width: 110px; }
      .theme-btn { min-width: auto; }
      .benchmark-row { grid-template-columns: 1fr; }
      .mastery { align-items: stretch; flex-direction: column; }
      .workbench-banner { grid-template-columns: 1fr; }
      .acceptance-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">AI</div>
        <h1>AI Application Engineer</h1>
        <p class="small muted">A self-paced, project-first course for senior developers.</p>
        <p class="small muted">v2.0 · reviewed 2026-09-16</p>
      </div>
      <input id="search" class="search" type="search" placeholder="Search modules..." aria-label="Search modules">
      <nav id="moduleList" class="module-list" aria-label="Course modules"></nav>
      <div class="sidebar-actions">
        <button class="btn" id="dashboardBtn">Dashboard</button>
        <button class="btn danger" id="resetBtn">Reset</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="btn mobile-menu" id="menuBtn" aria-label="Open course navigation">Menu</button>
        <div>
          <strong id="topTitle">Course dashboard</strong>
          <div class="small muted" id="topSubtitle">Mastery-based progression</div>
        </div>
        <div class="topbar-actions">
          <button class="btn theme-btn" id="themeBtn" aria-label="Switch color theme">Dark mode</button>
          <div class="progress-wrap">
            <div class="progress-label"><span>Evidence gates</span><span id="progressText">0%</span></div>
            <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
          </div>
        </div>
      </header>
      <div class="content">
        <section id="dashboardView"></section>
        <section id="moduleView" class="hidden"></section>
      </div>
    </main>
  </div>

  <script>
    const courseMeta = {
      version: "2.0",

        <table class="decision-table">
          <thead><tr><th>Criterion</th><th>Passing evidence</th></tr></thead>
          <tbody>${teaching.rubric.map((item, index) => `<tr><td>${index + 1}</td><td>${escapeHtml(item)}</td></tr>`).join("")}</tbody>
        </table>
        <div class="evidence-form">
          <label>Cold-task artifact or recording
            <input data-assessment-field="artifact" value="${escapeHtml(assessment.artifact || "")}" placeholder="artifacts/module-${String(m.number).padStart(2, "0")}/cold-task.md">
          </label>
          <label>Independent rubric score (1–5)
            <input data-assessment-field="score" type="number" min="1" max="5" value="${escapeHtml(assessment.score || "")}" placeholder="Minimum 3">
          </label>
          <label>Independent reviewer identity or review reference
            <input data-assessment-field="reviewer" value="${escapeHtml(assessment.reviewer || "")}" placeholder="Reviewer name, pull request, issue, or recording">
          </label>
          <label>Reviewer feedback
            <textarea data-assessment-field="feedback" placeholder="Incorrect assumptions, missed failure modes, weak evidence, and required revision...">${escapeHtml(assessment.feedback || "")}</textarea>
          </label>
        </div>
        <p class="footer-note">Passing requires a score of at least 3/5 from another engineer and a revised artifact addressing the feedback.</p>
      </section></div>`;
    }
    function renderBenchmark(m) {
      const values = state.benchmarks[m.id] || {};
      const p = moduleState(m.id);
      const allLabs = p.lab.filter(Boolean).length === practicalGuides[m.id].phases.length;
      const quizPass = p.quizScore >= 80;
      const metricPass = m.metrics.every(([, target], i) => meetsTarget(values[i], target));
      const sampleSize = Number(values._sampleSize || 0);
      const denominator = Number(values._denominator || 0);
      const samplePass = sampleSize >= minimumSamples[m.id] && denominator === sampleSize;
      const assessment = state.assessments[m.id] || {};
      const coldTaskPass = isMeaningful(assessment.artifact) && Number(assessment.score || 0) >= 3 &&
        isMeaningful(assessment.reviewer) && isMeaningful(assessment.feedback);
      const evidencePass = isMeaningful(values._artifactPath) && isMeaningful(values._protocol) &&
        isMeaningful(values._manifestPath) && isMeaningful(values._confidenceMethod) &&
        Number(values._numerator || 0) >= 0 && Number(values._denominator || 0) > 0 &&
        Number(values._numerator || 0) <= Number(values._denominator || 0) &&
        values._verificationPassed === true && values._manifestValidated === true && values._holdoutProtected === true;
      const sampleGuidance = minimumSampleGuidance(m);
      return `<div class="grid-2">
        <div class="card">
          <p class="eyebrow">Evidence over intuition</p>
          <h3>Benchmark scorecard</h3>
          <div class="benchmark-row"><strong>Metric</strong><strong class="small">Target</strong><strong class="small">Observed</strong></div>
          ${m.metrics.map(([name, target], i) => `<div class="benchmark-row">
            <span>${escapeHtml(name)}</span><span class="badge">${escapeHtml(target)}</span>
            <input data-metric="${i}" value="${escapeHtml(values[i] || "")}" placeholder="Enter result">
          </div>`).join("")}
          <div class="evidence-form">
            <label>Evaluated sample or task runs
              <input data-evidence="_sampleSize" type="number" min="0" value="${escapeHtml(values._sampleSize || "")}" placeholder="Minimum ${minimumSamples[m.id]}">
            </label>
            <p class="small muted">${escapeHtml(sampleGuidance)}</p>
            <label>Artifact or report path
              <input data-evidence="_artifactPath" value="${escapeHtml(values._artifactPath || "")}" placeholder="artifacts/module-${String(m.number).padStart(2, "0")}/report.json">
            </label>
            <label>Predeclared protocol summary
              <textarea data-evidence="_protocol" placeholder="Dataset version, baseline, candidate, metrics, slices, exclusions, confidence method, and release gates...">${escapeHtml(values._protocol || "")}</textarea>
            </label>
            <label>Machine-readable evidence manifest
              <input data-evidence="_manifestPath" value="${escapeHtml(values._manifestPath || "")}" placeholder="artifacts/module-${String(m.number).padStart(2, "0")}/evidence.json">
            </label>
            <label>Successful outcomes or valid cases
              <input data-evidence="_numerator" type="number" min="0" value="${escapeHtml(values._numerator || "")}" placeholder="Numerator">
            </label>
            <label>Total independent outcomes or cases
              <input data-evidence="_denominator" type="number" min="1" value="${escapeHtml(values._denominator || "")}" placeholder="Denominator">
            </label>
            <label>Confidence method
              <input data-evidence="_confidenceMethod" value="${escapeHtml(values._confidenceMethod || "")}" placeholder="Exact binomial, paired bootstrap, cluster bootstrap...">
            </label>
            <label class="option"><input data-evidence-check="_verificationPassed" type="checkbox" ${values._verificationPassed ? "checked" : ""}><span>The verification command passed and generated the referenced artifact.</span></label>
            <label class="option"><input data-evidence-check="_manifestValidated" type="checkbox" ${values._manifestValidated ? "checked" : ""}><span>The evidence manifest passed the repository validator.</span></label>
            <label class="option"><input data-evidence-check="_holdoutProtected" type="checkbox" ${values._holdoutProtected ? "checked" : ""}><span>The final holdout was not used to tune this candidate; failures were preserved in the report.</span></label>
          </div>
          <p class="footer-note">For numeric rows, enter exactly one value in the target's displayed unit. Counts and confidence bounds are separate rows. This browser cannot inspect your repository, so completion remains a clearly labeled self-attestation backed by an artifact path.</p>
        </div>
        <div class="card">
          <h3>Evidence gate</h3>
          <p>A module records learner attestation only when all evidence categories pass. This is not external certification.</p>
          <ul>
            <li>${quizPass ? "Passed" : "Pending"}: knowledge score of at least 80%</li>
            <li class="${coldTaskPass ? "gate-pass" : "gate-fail"}">${coldTaskPass ? "Passed" : "Pending"}: independently reviewed cold task scored at least 3/5</li>
            <li>${allLabs ? "Passed" : "Pending"}: every lab milestone completed</li>
            <li class="${metricPass ? "gate-pass" : "gate-fail"}">${metricPass ? "Passed" : "Pending"}: observed values satisfy numeric targets</li>
            <li class="${samplePass ? "gate-pass" : "gate-fail"}">${samplePass ? "Passed" : "Pending"}: at least ${minimumSamples[m.id]} independent cases or task runs</li>
            <li class="${evidencePass ? "gate-pass" : "gate-fail"}">${evidencePass ? "Passed" : "Pending"}: protocol, artifact, verification, and holdout attestations</li>
          </ul>
          <div class="mastery">
            <div><strong>${p.complete ? "Learner attestation recorded" : "Evidence incomplete"}</strong><div class="small muted">This status records supplied evidence; professional readiness still requires repository inspection, independent review, and real-user evidence.</div></div>
            <button class="btn primary" id="evaluateGate">Evaluate gate</button>
          </div>
        </div>
      </div>`;
    }
    function isMeaningful(value) {
      const normalized = String(value || "").trim().toLowerCase();
      return normalized.length >= 3 && !["n/a", "na", "none", "todo", "tbd", "pass"].includes(normalized);
    }
    function minimumSampleGuidance(m) {
      const bounds = m.metrics.map(([name, target]) => {
        const lower = String(name).includes("lower 95% bound") && String(target).match(/>=\s*(\d+(?:\.\d+)?)%/);
        const upper = String(name).includes("upper 95% bound") && String(target).match(/<=\s*(\d+(?:\.\d+)?)%/);
        if (lower) {
          const target = Number(lower[1]) / 100;
          return Math.ceil(Math.log(0.05) / Math.log(target));
        }
        if (upper) {
          const target = Number(upper[1]) / 100;
          return Math.ceil(Math.log(0.05) / Math.log(1 - target));
        }
        return 0;
      });
      const implied = Math.max(0, ...bounds);
      if (!implied) return `Course floor: ${minimumSamples[m.id]} cases. Document power or precision rationale for the metric that drives the decision.`;
      return `Course floor: ${minimumSamples[m.id]} cases. A zero-failure exact one-sided 95% bound at the strictest displayed percentage needs about ${implied} independent cases; otherwise report the honest wider interval and do not claim the target.`;
    }
    function meetsTarget(observed, target) {
      const raw = String(observed || "").trim();
      if (!raw || ["n/a", "na", "none", "todo", "tbd"].includes(raw.toLowerCase())) return false;
      const observedMatches = [...raw.matchAll(/-?\d+(?:\.\d+)?/g)];
      const targetMatch = String(target).match(/(>=|<=|>|<)\s*(-?\d+(?:\.\d+)?)/);
      if (targetMatch) {
        if (observedMatches.length !== 1) return false;
        const actual = Number(observedMatches[0][0]);
        const expected = Number(targetMatch[2]);
        return { ">=": actual >= expected, "<=": actual <= expected, ">": actual > expected, "<": actual < expected }[targetMatch[1]];
      }
      const exactMatch = String(target).match(/^(-?\d+(?:\.\d+)?)(%)?$/);
      if (exactMatch) {
        if (observedMatches.length !== 1) return false;
        return Number(observedMatches[0][0]) === Number(exactMatch[1]);
      }
      return isMeaningful(raw);
    }
    function wireTab(m) {
      if (state.tab === "learn") {
        document.getElementById("notes").addEventListener("input", e => { state.notes[m.id] = e.target.value; saveState(); });
      }
      if (state.tab === "lab") {
        document.getElementById("buildLog").addEventListener("input", e => {
          state.buildLogs ||= {};
          state.buildLogs[m.id] = e.target.value;
          saveState();
        });
        document.querySelectorAll("[data-lab]").forEach(box => box.addEventListener("change", e => {
          const p = moduleState(m.id);
          p.lab[Number(e.target.dataset.lab)] = e.target.checked;
          state.progress[m.id] = p; saveState(); renderModule(); renderSidebar(document.getElementById("search").value);
        }));
      }
      if (state.tab === "test") {
        document.getElementById("quizForm").addEventListener("submit", e => {
          e.preventDefault();
          const questions = [...m.quiz, ...advancedQuestions[m.id]];
          let correct = 0;
          questions.forEach((q, i) => {
            const selected = new FormData(e.target).get(`q${i}`);
            if (Number(selected) === q[2]) correct++;
          });
          const score = Math.round(correct / questions.length * 100);
          const p = moduleState(m.id);
          p.quizScore = Math.max(p.quizScore || 0, score);
          p.quizAttempted = true;
          state.progress[m.id] = p; saveState(); renderModule();
        });
        document.querySelectorAll("[data-assessment-field]").forEach(input => input.addEventListener("input", e => {
          state.assessments[m.id] ||= {};
          state.assessments[m.id][e.target.dataset.assessmentField] = e.target.value;
          saveState();
        }));
      }
      if (state.tab === "benchmark") {
        document.querySelectorAll("[data-metric]").forEach(input => input.addEventListener("input", e => {
          state.benchmarks[m.id] ||= {};
          state.benchmarks[m.id][e.target.dataset.metric] = e.target.value;
          saveState();
        }));
        document.querySelectorAll("[data-evidence]").forEach(input => input.addEventListener("input", e => {
          state.benchmarks[m.id] ||= {};
          state.benchmarks[m.id][e.target.dataset.evidence] = e.target.value;
          saveState();
        }));
        document.querySelectorAll("[data-evidence-check]").forEach(input => input.addEventListener("change", e => {
          state.benchmarks[m.id] ||= {};
          state.benchmarks[m.id][e.target.dataset.evidenceCheck] = e.target.checked;
          saveState();
        }));
        document.getElementById("evaluateGate").addEventListener("click", () => {
          const p = moduleState(m.id);
          const values = state.benchmarks[m.id] || {};
          p.complete = p.quizScore >= 80 &&
            isMeaningful((state.assessments[m.id] || {}).artifact) &&
            Number((state.assessments[m.id] || {}).score || 0) >= 3 &&
            isMeaningful((state.assessments[m.id] || {}).reviewer) &&
            isMeaningful((state.assessments[m.id] || {}).feedback) &&
            p.lab.filter(Boolean).length === practicalGuides[m.id].phases.length &&
            m.metrics.every(([, target], i) => meetsTarget(values[i], target)) &&
            Number(values._sampleSize || 0) >= minimumSamples[m.id] &&
            Number(values._denominator || 0) === Number(values._sampleSize || 0) &&
            isMeaningful(values._artifactPath) &&
            isMeaningful(values._protocol) &&
            isMeaningful(values._manifestPath) &&
            isMeaningful(values._confidenceMethod) &&
            Number(values._numerator || 0) >= 0 &&
            Number(values._denominator || 0) > 0 &&
            Number(values._numerator || 0) <= Number(values._denominator || 0) &&
            values._verificationPassed === true &&
            values._manifestValidated === true &&
            values._holdoutProtected === true;
          state.progress[m.id] = p; saveState(); renderModule();
          renderSidebar(document.getElementById("search").value);
        });
      }
      if (state.tab === "interview") {
        document.querySelectorAll("[data-interview-score]").forEach(input => input.addEventListener("input", e => {
          state.interviews[m.id] ||= { scores: {} };
          state.interviews[m.id].scores ||= {};
          state.interviews[m.id].scores[e.target.dataset.interviewScore] = e.target.value;
          saveState();
        }));
        document.querySelectorAll("[data-interview-field]").forEach(input => input.addEventListener("input", e => {
          state.interviews[m.id] ||= { scores: {} };
          state.interviews[m.id][e.target.dataset.interviewField] = e.target.value;
          saveState();
        }));
      }
    }

    document.getElementById("search").addEventListener("input", e => renderSidebar(e.target.value));
    document.addEventListener("click", async event => {
      const button = event.target.closest("[data-copy]");
      if (!button) return;
      const text = button.parentElement.querySelector("pre").textContent;
      try {
        await navigator.clipboard.writeText(text);
        button.textContent = "Copied";
        setTimeout(() => { button.textContent = "Copy"; }, 1200);
      } catch {
        button.textContent = "Select text";
      }
    });
    document.getElementById("dashboardBtn").addEventListener("click", renderDashboard);
    document.getElementById("menuBtn").addEventListener("click", () => document.getElementById("sidebar").classList.toggle("open"));
    function updateThemeButton() {
      const dark = document.documentElement.getAttribute("data-theme") === "dark";
      document.getElementById("themeBtn").textContent = dark ? "Light mode" : "Dark mode";
    }
    document.getElementById("themeBtn").addEventListener("click", () => {
      const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem(themeKey, next);
      updateThemeButton();
    });
    document.getElementById("resetBtn").addEventListener("click", () => {
      if (confirm("Reset all course progress, notes, and benchmark results?")) {
        localStorage.removeItem(storageKey);
        state = structuredClone(defaultState);
        document.getElementById("search").value = "";
        renderDashboard();
      }
    });
    const deepLink = new URLSearchParams(window.location.search || window.location.hash.slice(1));
    const requestedModule = deepLink.get("module");
    const requestedTab = deepLink.get("tab");
    if (modules.some(m => m.id === requestedModule)) state.active = requestedModule;
    if (["learn", "lab", "test", "benchmark", "interview"].includes(requestedTab)) state.tab = requestedTab;
    updateThemeButton();
    renderSidebar();
    state.active ? openModule(state.active) : renderDashboard();
  </script>
</body>
</html>
